name: Malware scan and CPU runner no-op

on:
  push:
    branches:
      - 'pull-request/[0-9]+'

permissions: {}

concurrency:
  group: malware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  malware-scan:
    name: Scan approved revision for malware
    if: github.repository == 'NVIDIA/tensorrt-edge-llm'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    permissions:
      id-token: write
    env:
      SCANNER_IMAGE: ${{ vars.MALWARE_SCANNER_IMAGE }}
      SCANNER_PROGRAM_ID: ${{ vars.MALWARE_SCANNER_PROGRAM_ID }}
      TELEPORT_PROXY: ${{ vars.MALWARE_TELEPORT_PROXY }}
      TELEPORT_VERSION: ${{ vars.MALWARE_TELEPORT_VERSION }}
      TELEPORT_JOIN_TOKEN: ${{ vars.MALWARE_TELEPORT_JOIN_TOKEN }}
      TELEPORT_APP: ${{ vars.MALWARE_TELEPORT_APP }}
    steps:
      - name: Check scanner configuration
        shell: bash
        run: |
          for variable in SCANNER_IMAGE SCANNER_PROGRAM_ID TELEPORT_PROXY TELEPORT_VERSION TELEPORT_JOIN_TOKEN TELEPORT_APP; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing malware scan configuration: $variable"
              exit 1
            fi
          done
          if [[ ! "$SCANNER_IMAGE" =~ ^nvcr\.io/[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::MALWARE_SCANNER_IMAGE must be an nvcr.io image pinned by SHA-256 digest."
            exit 1
          fi
          if [[ ! "$TELEPORT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::MALWARE_TELEPORT_VERSION must be an explicit release version."
            exit 1
          fi
          for command in docker curl python3; do
            command -v "$command" > /dev/null
          done

      - name: Install tunnel client
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1
        with:
          version: ${{ vars.MALWARE_TELEPORT_VERSION }}

      - name: Import nvcr.io credentials from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: ${{ vars.NV_VAULT_URL }}
          role: ${{ vars.NVCR_VAULT_ROLE }}
          method: jwt
          path: ${{ vars.NVCR_VAULT_JWT_PATH }}
          jwtGithubAudience: https://token.actions.githubusercontent.com
          namespace: ${{ vars.NVCR_VAULT_NAMESPACE }}
          secrets: |
            ${{ vars.NVCR_VAULT_SECRET_PATH }} username | NVCR_IO_USERNAME ;
            ${{ vars.NVCR_VAULT_SECRET_PATH }} password | NVCR_IO_PASSWORD

      - name: Pull scanner image
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/malware-docker
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          if ! printf '%s' "$NVCR_IO_PASSWORD" | docker login nvcr.io --username "$NVCR_IO_USERNAME" --password-stdin > "$RUNNER_TEMP/malware-image.log" 2>&1; then
            echo "::error::Scanner registry authentication failed."
            exit 1
          fi
          if ! docker pull "$SCANNER_IMAGE" >> "$RUNNER_TEMP/malware-image.log" 2>&1; then
            echo "::error::Scanner image pull failed."
            exit 1
          fi

      - name: Scan commit and require a clean verdict
        shell: bash
        run: |
          umask 077
          python3 - <<'PYCONFIG'
          import json
          import os
          from pathlib import Path

          config = {
              "version": "v2",
              "proxy_server": os.environ["TELEPORT_PROXY"],
              "onboarding": {
                  "join_method": "github",
                  "token": os.environ["TELEPORT_JOIN_TOKEN"],
              },
              "storage": {"type": "memory"},
              "outputs": [],
              "services": [{
                  "type": "application-tunnel",
                  "app_name": os.environ["TELEPORT_APP"],
                  "listen": "tcp://127.0.0.1:8888",
              }],
          }
          (Path(os.environ["RUNNER_TEMP"]) / "malware-tbot.json").write_text(json.dumps(config))
          PYCONFIG
          tbot start -c "$RUNNER_TEMP/malware-tbot.json" > "$RUNNER_TEMP/malware-tbot.log" 2>&1 &
          tunnel_pid=$!
          stop_tunnel() { kill "$tunnel_pid" 2>/dev/null || true; }
          trap stop_tunnel EXIT
          ready=false
          for _ in {1..60}; do
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "::error::Scanner tunnel exited before becoming ready."
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:8888/ready > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Scanner tunnel did not become ready."
            exit 1
          fi
          # The backend scans the immutable revision; no PR code runs on this runner.
          # Host networking connects the scanner to the loopback tunnel.
          if docker run --rm --pull=never --name "malware-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --network host \
            --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --entrypoint pulse-malware-scanner-cli \
            "$SCANNER_IMAGE" \
            -n "$SCANNER_PROGRAM_ID" \
            --tenant github-first \
            --base-url http://127.0.0.1:8888 \
            --wait=true --output=false \
            source-code-scan \
            --repository-uri "https://github.com/${GITHUB_REPOSITORY}.git" \
            --commit-sha "$GITHUB_SHA" > "$RUNNER_TEMP/malware-scan.log" 2>&1; then
            printf 'Malware scan returned CLEAN for commit %s.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "::error::Malware scan failed (exit $code). Downstream jobs are blocked."
            exit "$code"
          fi

      - name: Clean up scanner resources
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/malware-docker
        run: |
          docker rm -f "malware-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > /dev/null 2>&1 || true
          rm -rf -- "$DOCKER_CONFIG"
          rm -f -- "$RUNNER_TEMP/malware-tbot.json" "$RUNNER_TEMP/malware-tbot.log" \
            "$RUNNER_TEMP/malware-image.log" "$RUNNER_TEMP/malware-scan.log"

  noop:
    name: Verify CPU runner access
    needs: malware-scan
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    steps:
      - name: Verify CPU runner access
        run: echo "CPU runner access verified."
