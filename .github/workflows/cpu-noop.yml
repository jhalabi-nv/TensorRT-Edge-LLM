name: Malware scan and CPU runner no-op

on:
  push:
    branches:
      - 'pull-request/[0-9]+'

permissions: {}

concurrency:
  group: malware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  malware-scan:
    name: Scan approved revision for malware
    if: github.repository == 'NVIDIA/tensorrt-edge-llm'
    permissions:
      id-token: write
    # NVIDIA/security-workflows#23: pilot revision, pinned before merge.
    uses: NVIDIA/security-workflows/.github/workflows/malware-scan-pulse.yml@33c728d48fb19ee8efe8be4da196746f0fcba3d6
    with:
      runs-on: linux-amd64-cpu4
      nspect_id: ${{ vars.NSPECT_ID }}
      failure_policy: strict
      upload_report: false

  noop:
    name: Verify CPU runner access
    needs: malware-scan
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    steps:
      - name: Verify CPU runner access
        run: echo "CPU runner access verified."
